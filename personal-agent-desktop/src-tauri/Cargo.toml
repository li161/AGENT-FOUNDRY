[package]
name = "personal-agent"
version = "0.1.0"
description = "Portable Personal Agent desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "personal_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
