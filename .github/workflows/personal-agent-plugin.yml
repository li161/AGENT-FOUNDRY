name: Personal Agent plugin checks

on:
  pull_request:
    paths:
      - "dsh-plugin/**"
      - ".github/workflows/personal-agent-plugin.yml"
  push:
    branches:
      - "demo/deepseek-harness-personal-agent"
    paths:
      - "dsh-plugin/**"
      - ".github/workflows/personal-agent-plugin.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.28.5"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
